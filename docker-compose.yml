services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Winnipeg
      - TZ=America/Winnipeg
    volumes:
      - n8n_data:/home/node/.n8n
      # Mount repo so you can drop prompts/profile into Code nodes easily
      - ./:/workspace/pipeline:ro

volumes:
  n8n_data:
